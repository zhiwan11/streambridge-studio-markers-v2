name: Build StreamBridge Studio Markers v2

on:
  push:
    paths:
      - ".github/workflows/bootstrap-v2.yml"
      - "scripts/bootstrap_v2.py"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[bootstrap-v2]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Pull clean StreamBridge upstream
        run: |
          git clone --depth 1 https://github.com/h4harsimran/streambridge.git /tmp/streambridge
          rsync -a --exclude='.git' /tmp/streambridge/ ./

      - name: Preserve current badge rules
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://streambridge-studio-markers.vercel.app/badges.json \
            -o data/badges-base.json
          python3 -m json.tool data/badges-base.json >/dev/null

      - name: Apply logo and Emby Studio fallback patches
        run: python3 scripts/bootstrap_v2.py

      - name: Validate generated project
        run: |
          test -f lib/studioProvider.js
          test -f public/badges/streaming-fixed/stream-011.svg
          test -f public/badges/streaming-fixed/stream-016.svg
          node --check index.js
          node --check lib/commonClient.js
          node --check lib/embyClient.js
          node --check lib/jellyfinClient.js
          node --check lib/studioProvider.js
          node -e 'const d=require("./data/badges-base.json"); if(d.filters.length!==245) process.exit(1); if(d.filters.filter(x=>x.groupId==="gs").length!==144) process.exit(1); console.log("badge counts ok")'

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build v2: fix platform logos and add Studio fallback"
            git push
          fi
